<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hopsync</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="banner" class="banner" hidden>Session ended. Open the new link printed in the terminal.</div>

  <header class="topbar">
    <strong class="app-name">hopsync</strong>
    <label><input type="checkbox" id="opt-verify" autocomplete="off"> Verify (sha256)</label>
    <label><input type="checkbox" id="opt-links" autocomplete="off"> Copy symlinks as links</label>
    <label id="conflict-option" class="conflict-option">If a file exists:
      <select id="opt-conflict" autocomplete="off">
        <option value="ask">Ask</option>
        <option value="skip">Skip</option>
        <option value="rename">Keep both (rename)</option>
        <option value="overwrite">Overwrite</option>
      </select>
    </label>
  </header>

  <main class="panes">
    <section id="pane-left"></section>
    <section id="pane-right"></section>
  </main>

  <section id="jobs" class="jobs"></section>
  <dialog id="conflict-dialog" class="conflict-dialog"></dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
