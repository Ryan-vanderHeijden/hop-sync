[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hopsync"
dynamic = ["version"]  # read from hopsync/__init__.py, so there is one place to change
description = "Move files between two SFTP hosts through your computer, with a dual-pane web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["asyncssh", "fastapi", "uvicorn", "websockets"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
hopsync = "hopsync.cli:main"

[tool.hatch.version]
path = "hopsync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hopsync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = '-m "not slow"'
markers = [
    "slow: large transfers, skipped by default",
    "integration: needs docker test hosts",
]
